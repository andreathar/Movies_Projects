<circle cx="350" cy="165" r="35" fill="#538b94"/><text x="315" y="116" font-size="21">ANDRE</text>
<circle cx="350" cy="510" r="35" fill="#68707c"/><text x="285" y="568" font-size="21">GALILEO</text>
