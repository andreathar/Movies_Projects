ion; checks actually run; dependencies/open decisions; next owner or blocker. Separate observed from inferred. Mark unavailable checks not_run with owner and unblock condition. The parent packages the handoff and arranges missing media/language verification. Text review cannot complete full-media QC, certify zero-face safety or replace qualified language/human acceptance.\n"
