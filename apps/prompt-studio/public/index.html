<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M11 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">▶</span><div><b>Prompt Studio</b><small>Kling · Higgsfield</small></div></div>
    <div class="proj-pick">
      <select id="projectSelect" aria-label="Project"></select>
      <button class="btn ghost sm" id="newProject" title="New project">＋</button>
    </div>
    <nav id="steps" aria-label="Workflow"></nav>
    <div class="side-foot"><span id="saveState" class="muted">Saved</span></div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="stepTitle"></h1><p id="stepHint" class="muted"></p></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div id="banner"></div>
    <section id="view"></section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
